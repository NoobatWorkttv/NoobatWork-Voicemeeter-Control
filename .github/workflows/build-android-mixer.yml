name: Android Mixer v0.1.0 Preview
on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/build-android-mixer.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-mixer-preview
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore private app signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_MIXER_KEYSTORE }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/mixer.jks"
          chmod 600 "$RUNNER_TEMP/mixer.jks"
      - name: Build APK and run address tests and Android lint
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/mixer.jks
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_MIXER_KEY_PASSWORD }}
        run: gradle -p android-app testDebugUnitTest lintDebug assembleRelease assembleDebugAndroidTest assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start mixer integration fixture
        run: |
          npm install --prefix "$RUNNER_TEMP/fixture" --no-audit --no-fund ws@8.18.3
          NODE_PATH="$RUNNER_TEMP/fixture/node_modules" node android-app/tests/mixer-fixture.cjs > "$RUNNER_TEMP/mixer-fixture.log" 2>&1 &
      - name: Android 15 pairing, WebSocket control, persistence and rotation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: |
            adb reverse tcp:18879 tcp:18879
            gradle -p android-app connectedDebugAndroidTest
            test -f /tmp/mixer-command-proof.json
            if adb shell pm list packages | grep -q '^package:com.noobatwork.mixer$'; then adb uninstall com.noobatwork.mixer; fi
            adb install android-app/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.noobatwork.mixer/.MixerActivity
            sleep 3
            adb exec-out screencap -p > android-app/emulator.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android-app/app/build/reports
            android-app/app/build/outputs/androidTest-results
            android-app/emulator.png
      - name: Verify and publish separate signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android-app/dist
          cp android-app/app/build/outputs/apk/release/app-release.apk android-app/dist/NoobatWork-Mixer-Android-v0.1.0-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-app/dist/*.apk
          (cd android-app/dist && sha256sum *.apk > SHA256SUMS.txt)
          node android-app/tools/release.cjs
      - name: Remove signing material from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/mixer.jks"
