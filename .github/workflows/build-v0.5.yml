name: Build v0.5 App Mixer + One-Click Setup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v0.5.yml'
      - 'com.noobatwork.voicemeeter.sdPlugin/**'
      - 'windows-audio/**'
      - 'installer/**'
      - 'tools/**'
      - 'tests/**'
      - 'INSTALL.ps1'
      - 'INSTALL.bat'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate Windows PowerShell scripts
        shell: powershell
        run: |
          foreach ($p in @('com.noobatwork.voicemeeter.sdPlugin\bridge.ps1', 'installer\Setup.ps1','INSTALL.ps1')) {
            $tokens = $null; $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$tokens, [ref]$errors)
            if (-not $ast -or $errors.Count -gt 0) {
              foreach ($e in $errors) { Write-Host $e.ToString() }
              throw "Invalid Windows PowerShell script $p"
            }
          }
      - name: Compile isolated per-app audio helper
        shell: powershell
        run: |
          dotnet publish windows-audio/NoobatWorkAudioSessions.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o com.noobatwork.voicemeeter.sdPlugin/bin
          if ($LASTEXITCODE -ne 0) { throw 'Windows audio helper compilation failed' }
          if (-not (Test-Path com.noobatwork.voicemeeter.sdPlugin/bin/NoobatWorkAudioSessions.exe)) { throw 'Missing audio helper binary' }
      - name: Generate images and validate manifest
        shell: bash
        run: python tools/generate-icons.py
      - name: Run Node unit tests and check scripts
        shell: bash
        run: |
          node --check com.noobatwork.voicemeeter.sdPlugin/plugin.js
          node --check com.noobatwork.voicemeeter.sdPlugin/settings.js
          node --check com.noobatwork.voicemeeter.sdPlugin/compact-gestures.js
          node --check com.noobatwork.voicemeeter.sdPlugin/fader-model.js
          node --test tests/*.test.cjs
      - name: Package source ZIP and Windows helper
        shell: bash
        run: python tools/package-v0.5.py
      - name: Install Inno Setup compiler
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build Windows Setup.exe
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc 'installer\NoobatWork.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Setup.exe compilation failed' }
          $setup = Get-ChildItem -Recurse -File -Filter 'NoobatWork-Voicemeeter-Control-v0.5.0-alpha-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Setup.exe output was not produced' }
          Copy-Item -LiteralPath $setup.FullName -Destination 'NoobatWork-Voicemeeter-Control-v0.5.0-alpha-Setup.exe'
      - name: Publish setup and ZIP to GitHub Pre-Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.5.0-alpha'
          $existing = @(gh release list --limit 100 --json tagName | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })
          if ($LASTEXITCODE -ne 0) { throw 'Could not list releases' }
          if ($existing.Count -eq 0) {
            gh release create $tag --prerelease --title 'v0.5.0-alpha – App Mixer + Setup' --notes 'Experimental Windows application-session mixer. Self-contained setup automatically stops, backs up, updates and restarts Stream Deck. Windows and iPad runtime validation still required.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          gh release upload $tag 'NoobatWork-Voicemeeter-Control-v0.5.0-alpha-Setup.exe' 'NoobatWork-Voicemeeter-Control-v0.5.0-alpha.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
